name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main  # Altere para a sua branch principal (e.g., master ou main)
  workflow_dispatch: # Permite execução manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Define as permissões necessárias para o deploy no GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a versão do Node compatível com seu projeto
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      # 1. Constrói o Storybook
      - name: Build Storybook
        run: npm run build-storybook

      # 2. Configura o ambiente de deploy para o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Faz o upload dos artefatos de deploy (pasta storybook-static por padrão)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static' # Pasta de saída do 'storybook build'

      # 4. Faz o deploy no GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4